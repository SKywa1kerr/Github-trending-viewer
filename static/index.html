<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 热门项目</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=27">
</head>
<body>
    <div id="app">
        <!-- 加载页面 -->
        <div id="loading-screen" class="loading-screen">
            <div class="loading-spinner"></div>
            <p>正在初始化数据，请稍候...</p>
        </div>

        <!-- 主内容 -->
        <div id="main-content" class="main-content hidden">
            <!-- 顶部栏 -->
            <header class="header">
                <div class="header-left">
                    <div class="title-kicker">Open Source Radar</div>
                    <h1 class="title">GitHub <span class="title-accent">Trending</span></h1>
                    <span id="last-updated" class="last-updated">正在读取状态...</span>
                </div>
                <div class="header-right">
                    <button id="btn-refresh" class="btn btn-refresh" title="刷新数据">
                        <svg class="icon-refresh" viewBox="0 0 24 24" width="18" height="18">
                            <path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
                        </svg>
                        <span>刷新</span>
                    </button>
                    <button id="btn-theme" class="btn btn-theme" title="切换主题">
                        <svg class="icon-theme" viewBox="0 0 24 24" width="18" height="18">
                            <path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z" fill="currentColor"/>
                        </svg>
                    </button>
                    <div class="accent-picker" id="accent-picker" role="group" aria-label="强调色">
                        <button class="accent-dot" type="button" data-accent="teal" title="青绿" aria-label="青绿"></button>
                        <button class="accent-dot" type="button" data-accent="indigo" title="靛蓝" aria-label="靛蓝"></button>
                        <button class="accent-dot" type="button" data-accent="amber" title="琥珀" aria-label="琥珀"></button>
                        <button class="accent-dot" type="button" data-accent="rose" title="玫红" aria-label="玫红"></button>
                    </div>
                </div>
            </header>

            <section class="overview">
                <div class="overview-card">
                    <span class="overview-label">项目库</span>
                    <strong id="overview-total">--</strong>
                    <span class="overview-note">本地缓存</span>
                </div>
                <div class="overview-card">
                    <span class="overview-label">数据状态</span>
                    <strong id="overview-freshness">--</strong>
                    <span class="overview-note" id="overview-freshness-note">等待检查</span>
                </div>
                <div class="overview-card">
                    <span class="overview-label">翻译队列</span>
                    <strong id="overview-translations">--</strong>
                    <span class="overview-note">待处理 / 已完成</span>
                </div>
                <div class="overview-card">
                    <span class="overview-label">系统诊断</span>
                    <strong id="overview-health">--</strong>
                    <span class="overview-note" id="overview-health-note">等待检查</span>
                </div>
            </section>

            <!-- 刷新进度条 -->
            <div id="refresh-progress" class="refresh-progress hidden">
                <div class="progress-info">
                    <span id="progress-stage"></span>
                    <span id="progress-detail"></span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>

            <section class="status-dock">
                <div id="translation-summary" class="translation-summary">
                    <div class="translation-summary-text">
                        <span id="translation-summary-title">翻译队列</span>
                        <span id="translation-summary-detail">正在读取状态...</span>
                    </div>
                    <button id="btn-retry-failed" class="btn btn-small" type="button">重试失败翻译</button>
                </div>
                <div id="health-summary" class="health-summary hidden">
                    <div class="health-summary-text">
                        <span id="health-summary-title">系统诊断</span>
                        <span id="health-summary-detail"></span>
                    </div>
                    <button id="btn-refresh-health" class="btn btn-small" type="button">重新检查</button>
                </div>
            </section>

            <!-- 板块切换 -->
            <nav class="category-tabs">
                <span class="tab-indicator" id="tab-indicator" aria-hidden="true"></span>
                <button class="tab active" data-category="ai">AI</button>
                <button class="tab" data-category="tools">实用工具</button>
                <button class="tab" data-category="devtools">开发工具</button>
                <button class="tab" data-category="other">其他热门</button>
                <button class="tab tab-recommend" data-category="recommend">
                    <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;margin-right:2px"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>
                    为你推荐
                </button>
                <button class="tab tab-favorites" data-category="favorites">
                    <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;margin-right:2px"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="currentColor"/></svg>
                    收藏
                </button>
            </nav>

            <!-- 筛选栏 -->
            <div class="filters">
                <div class="filter-group">
                    <label>语言</label>
                    <select id="filter-language">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>排序</label>
                    <select id="filter-sort">
                        <option value="score">综合</option>
                        <option value="stars">Star 总数</option>
                        <option value="stars_gained">新增 Star</option>
                        <option value="updated">最近更新</option>
                    </select>
                </div>
                <div class="filter-group search-group">
                    <input type="text" id="search-input" placeholder="搜索项目...">
                    <button id="btn-search-github" class="btn btn-small btn-github-search" title="搜索整个 GitHub">搜索 GitHub</button>
                </div>
                <button id="btn-add-keyword" class="btn btn-small" title="添加关注词">+ 添加关注词</button>
            </div>

            <div id="result-context" class="result-context hidden" aria-live="polite">
                <span id="result-context-label" class="result-context-label"></span>
                <div class="result-context-main">
                    <strong id="result-context-title"></strong>
                    <span id="result-context-detail"></span>
                </div>
            </div>

            <!-- 项目卡片列表 -->
            <div id="project-list" class="project-list"></div>

            <!-- 滚动加载提示 -->
            <div id="load-more" class="scroll-loading hidden">
                <div class="scroll-loading-spinner"></div>
                <span>加载中...</span>
            </div>

            <!-- 空状态 -->
            <div id="empty-state" class="empty-state hidden">
                <p>暂无项目数据</p>
            </div>
        </div>

        <!-- 添加关注词弹窗 -->
        <div id="keyword-modal" class="modal hidden">
            <div class="modal-content">
                <h3>添加关注词</h3>
                <input type="text" id="keyword-input" placeholder="输入关键词，如 ai agent">
                <select id="keyword-category">
                    <option value="ai">AI</option>
                    <option value="tools">实用工具</option>
                    <option value="devtools">开发工具</option>
                    <option value="other">其他</option>
                </select>
                <div class="modal-actions">
                    <button id="btn-save-keyword" class="btn btn-primary">保存</button>
                    <button id="btn-cancel-keyword" class="btn">取消</button>
                </div>
                <div id="keyword-list" class="keyword-list"></div>
            </div>
        </div>
    </div>
    <!-- AI 聊天弹窗 -->
    <div id="chat-modal" class="modal hidden">
        <div class="modal-content chat-modal-content">
            <div class="chat-header">
                <div class="chat-title">
                    <svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:-3px;margin-right:6px">
                        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z" fill="currentColor"/>
                    </svg>
                    <span id="chat-repo-name"></span>
                </div>
                <button id="btn-close-chat" class="chat-close">&times;</button>
            </div>
            <div id="chat-messages" class="chat-messages">
                <div class="chat-welcome">
                    <p>你可以问我关于这个项目的任何问题，比如：</p>
                    <div class="chat-suggestions">
                        <button class="chat-suggestion" data-q="这个项目适合什么场景使用？">适合什么场景？</button>
                        <button class="chat-suggestion" data-q="这个项目的核心优势是什么？和同类项目相比如何？">核心优势是什么？</button>
                        <button class="chat-suggestion" data-q="如何快速上手这个项目？需要什么前置条件？">如何快速上手？</button>
                        <button class="chat-suggestion" data-q="这个项目有什么局限性或注意事项？">有什么局限性？</button>
                    </div>
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="输入你的问题...">
                <button id="btn-send-chat" class="btn-send">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 轻提示 -->
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <!-- 回到顶部 -->
    <button id="btn-back-top" class="btn-back-top" title="回到顶部">
        <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z" fill="currentColor"/>
        </svg>
    </button>
    <script type="module" src="/js/app.js?v=21"></script>
</body>
</html>
